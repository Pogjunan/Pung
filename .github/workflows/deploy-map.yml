name: Build and deploy wind station maps

on:
  push:
    branches: [main]
    paths:
      - "40m_WRF_WS_공간목록.csv"
      - "data/**"
      - "web/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile builders and check browser JavaScript
        run: |
          python -m py_compile \
            scripts/build_map.py \
            scripts/build_site.py \
            scripts/build_daily_availability.py \
            scripts/build_common_hourly_availability.py
          node --check web/assets/dashboard.js
          node --check web/assets/availability.js

      - name: Build combined dynamic site
        run: |
          python scripts/build_site.py \
            --nominal-input 40m_WRF_WS_공간목록.csv \
            --availability-data data/ws_availability_common_hourly.json.gz.b64 \
            --web-root web \
            --output _site

      - name: Validate generated site
        run: |
          test -s _site/index.html
          test -s _site/nominal.html
          test -s _site/availability.html
          test -s _site/data/ws_availability_common_hourly.json.gz.b64
          test -s _site/site_build_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("_site/site_build_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary.get("status") != "ok":
              raise SystemExit("Combined site build failed")

          expected_counts = {
              "station_ids": 43,
              "train_station_ids": 22,
              "verify_station_ids": 21,
              "selected_frames": 54000,
              "stations_ever_on_selected": 18,
              "stations_always_off_selected": 25,
              "mapped_station_ids": 42,
              "physical_site_groups": 39,
          }
          availability = summary["availability"]
          for key, expected in expected_counts.items():
              actual = availability.get(key)
              if actual != expected:
                  raise SystemExit(
                      f"Unexpected {key}: {actual} != {expected}"
                  )

          if summary.get("availability_grain") != "station_column":
              raise SystemExit("Availability is not station-column level")
          if summary.get("availability_encoding") != (
              "filtered_common_hour_sequence_with_per_station_inclusive_frame_runs"
          ):
              raise SystemExit("Unexpected availability encoding")

          selection = summary["selection"]
          if selection["retained_start"] != "2016-03-01 00:00:00":
              raise SystemExit("Unexpected common-hour start")
          if selection["retained_end"] != "2023-10-31 14:00:00":
              raise SystemExit("Unexpected common-hour end")
          if selection["state_change_frames"] != 1368:
              raise SystemExit("Unexpected state-change count")

          source = summary["source"]
          if source["sha256"] != (
              "1ce8382962c350ebe2d6edeacb3304acc637b8b7cbff1b0411d63751e3386bc1"
          ):
              raise SystemExit("Unexpected ON/OFF source hash")
          PY

      - name: Upload diagnostic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-station-map-build
          path: _site
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
