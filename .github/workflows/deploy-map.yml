name: Build and deploy wind station maps

on:
  push:
    branches: [main]
    paths:
      - "40m_WRF_WS_공간목록.csv"
      - "data/**"
      - "web/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python builders
        run: |
          python -m py_compile \
            scripts/build_map.py \
            scripts/build_site.py \
            scripts/build_daily_availability.py

      - name: Build combined dynamic site
        run: |
          python scripts/build_site.py \
            --nominal-input 40m_WRF_WS_공간목록.csv \
            --availability-data data/ws_availability_daily.json.gz.b64 \
            --web-root web \
            --output _site

      - name: Validate generated site
        run: |
          test -s _site/index.html
          test -s _site/nominal.html
          test -s _site/availability.html
          test -s _site/data/ws_availability_daily.json.gz.b64
          test -s _site/site_build_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("_site/site_build_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary.get("status") != "ok":
              raise SystemExit("Combined site build failed")
          if summary["availability"]["physical_site_groups"] != 39:
              raise SystemExit("Unexpected physical-site count")
          PY

      - name: Upload diagnostic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-station-map-build
          path: _site
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
