name: Build and deploy wind station map

on:
  push:
    branches: [main]
    paths:
      - "40m_WRF_WS_공간목록.csv"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile map builder
        run: python -m py_compile scripts/build_map.py

      - name: Build dynamic map
        run: |
          python scripts/build_map.py \
            --input 40m_WRF_WS_공간목록.csv \
            --output _site

      - name: Validate generated site
        run: |
          test -s _site/index.html
          test -s _site/build_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("_site/build_summary.json").read_text(encoding="utf-8"))
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary.get("status") not in {"ok", "placeholder"}:
              raise SystemExit("Unexpected build status")
          PY

      - name: Upload diagnostic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-station-map-build
          path: _site
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
