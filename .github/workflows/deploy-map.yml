name: Build and deploy wind station maps

on:
  push:
    branches: [main]
    paths:
      - "40m_WRF_WS_공간목록.csv"
      - "data/**"
      - "web/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile builders and check browser JavaScript
        run: |
          python -m py_compile \
            scripts/build_map.py \
            scripts/build_site.py \
            scripts/build_daily_availability.py \
            scripts/build_common_hourly_availability.py
          node --check web/assets/dashboard.js
          node --check web/assets/availability.js
          node --check web/assets/availability-all-v2.js
          node --check web/assets/paired.js

      - name: Build combined dynamic site
        run: |
          python scripts/build_site.py \
            --nominal-input 40m_WRF_WS_공간목록.csv \
            --availability-data data/ws_availability_common_hourly.json.gz.b64 \
            --full-history-data data/ws_availability_daily.json.gz.b64 \
            --paired-data data/ws_paired_selected_hourly.json.gz.b64 \
            --web-root web \
            --output _site

      - name: Validate generated site
        run: |
          test -s _site/index.html
          test -s _site/nominal.html
          test -s _site/availability.html
          test -s _site/availability-all.html
          test -s _site/paired.html
          test -s _site/data/ws_availability_common_hourly.json.gz.b64
          test -s _site/data/full-history-data.js
          test -s _site/data/paired-data.js
          test -s _site/site_build_summary.json
          grep -q '^window.FULL_HISTORY_DATA=' _site/data/full-history-data.js
          grep -q '^window.PAIRED_DATA=' _site/data/paired-data.js
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("_site/site_build_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary.get("status") != "ok":
              raise SystemExit("Combined site build failed")

          common = summary["common_hour"]
          common_expected = {
              "station_ids": 43,
              "train_station_ids": 22,
              "verify_station_ids": 21,
              "selected_frames": 54000,
              "stations_ever_on_selected": 18,
              "stations_always_off_selected": 25,
              "mapped_station_ids": 42,
              "physical_site_groups": 39,
          }
          for key, expected in common_expected.items():
              if common.get(key) != expected:
                  raise SystemExit(
                      f"Unexpected common {key}: "
                      f"{common.get(key)} != {expected}"
                  )

          full_history = summary["full_history"]
          full_expected = {
              "station_ids": 43,
              "train_station_ids": 22,
              "verify_station_ids": 21,
              "calendar_days": 10077,
              "mapped_station_ids": 42,
              "physical_site_groups": 39,
          }
          for key, expected in full_expected.items():
              if full_history.get(key) != expected:
                  raise SystemExit(
                      f"Unexpected full history {key}: "
                      f"{full_history.get(key)} != {expected}"
                  )

          paired = summary["paired"]
          paired_expected = {
              "train_sites": 8,
              "test_sites": 7,
              "total_sites": 15,
              "sites_ever_on": 15,
              "sites_never_on": 0,
              "frame_count": 78888,
              "mapped_sites": 14,
          }
          for key, expected in paired_expected.items():
              if paired.get(key) != expected:
                  raise SystemExit(
                      f"Unexpected paired {key}: "
                      f"{paired.get(key)} != {expected}"
                  )

          print("Full history: EVER ON 43/43")
          print("Paired selection: EVER ON 15/15")
          PY

      - name: Upload diagnostic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-station-map-build
          path: _site
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
